# Security System §12, automated dependency monitoring. Weekly and grouped, so
# updates arrive as a reviewable batch. Every update PR goes through CI like
# any other change. Both ecosystems wait three days after a release before
# proposing it, the same cooldown pnpm-workspace.yaml enforces on installs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: latest
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: latest
    cooldown:
      default-days: 3
