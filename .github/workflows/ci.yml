# The gate. Every job here is a required status check on `latest` and `main`
# (AGENTS.md "Testing policy" lists the exact branch-protection settings). A red
# job is reported with its output and fixed at the cause; it is never skipped,
# retried into green, or worked around by weakening an assertion.

name: CI

on:
  pull_request:
    branches: [latest, main]
  push:
    branches: [latest, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm exec playwright test e2e/diag.spec.ts --project "iPhone 17" --retries 0 --workers 1 --reporter list
