# Security System §12, install-time scripts: pnpm runs none by default. This is
# the whole allowlist, and each entry is a decision. @parcel/watcher needs its
# native build; sharp and unrs-resolver ship prebuilt binaries and do not.
allowBuilds:
  '@parcel/watcher': true
  sharp: false
  unrs-resolver: false

# Security System §12, version cooldown: never resolve a release younger than
# three days. Compromised versions have historically been caught and pulled
# within hours, so waiting turns "we were patient" into "we were unaffected".
# In minutes. Dependabot waits the same three days (.github/dependabot.yml).
minimumReleaseAge: 4320

# Security System §12, patched transitive dependencies. Next pins both below
# the fixed release, so they are lifted here until it moves past them; drop
# each entry once `pnpm why` shows Next resolving the patched version itself.
# source-map-js: GHSA-68fv-2mgg-jv7q (event-loop DoS), fixed in 1.2.2.
# sharp: GHSA-wq5f-xc86-pv6w (librsvg, CVE-2026-96889), fixed in 0.35.5.
#
# The Sanity CLI (`sanity` > `@sanity/cli`) pins three below their fixes, each
# within its own major, and the audit in CI fails on all three (2026-11-19).
# None runs in the site's server or browser code: they parse the CLI's config
# files and fetch for its build tooling. Drop each once `pnpm why` shows the
# CLI resolving the patched version itself.
# js-yaml 3.x: GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh.
# smol-toml: GHSA-7w5x-hrqm-74c2 and two moderates, fixed by 1.9.0.
# undici 7.x: GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26 and the TLS advisories.
overrides:
  source-map-js: '^1.2.2'
  sharp: '^0.35.5'
  'js-yaml@^3': '^3.15.2'
  'smol-toml@^1': '^1.9.0'
  'undici@^7': '^7.30.2'
